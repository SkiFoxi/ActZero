version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: analytical_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=analytical_user
      - POSTGRES_PASSWORD=analytical_pass
      - POSTGRES_DB=analytical_db
    ports:
      - "5432:5432"
    volumes:
      - analytical_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - analytical_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytical_user -d analytical_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: analytical_opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - analytical_es_data:/usr/share/opensearch/data
    networks:
      - analytical_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: analytical_kibana
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - analytical_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analytical_app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ELASTICSEARCH_URL=http://opensearch:9200
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=analytical_user
      - POSTGRES_PASSWORD=analytical_pass
      - POSTGRES_DB=analytical_db
      - APP_PORT=8080
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    ports:
      - "8080:8080"
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - analytical_network

volumes:
  analytical_postgres_data:
  analytical_es_data:

networks:
  analytical_network:
    driver: bridge